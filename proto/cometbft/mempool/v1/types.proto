syntax = "proto3";
package cometbft.mempool.v1;

option go_package = "github.com/ice-blockchain/cometbft/api/cometbft/mempool/v1";

// Txs contains a list of transaction from the mempool.
message Txs {
  repeated bytes txs = 1;
}

// RollbackTxs contains a list of transactions to remove from the mempool.
message RollbackTxs {
  repeated bytes txs = 1;
}

// Message is an abstract mempool message.
message Message {
  // Sum of all possible messages.
  oneof sum {
    Txs txs = 1;
    RollbackTxs rollback_txs = 2;
  }
}
